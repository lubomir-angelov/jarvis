services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    gpus: all
    environment:
      LLAMA_CACHE: /models
      # LD_LIBRARY_PATH=/app:/usr/local/lib:/usr/lib:${LD_LIBRARY_PATH}
      LD_LIBRARY_PATH: /app:/usr/local/lib:/usr/lib
    volumes:
      - ./models:/models
    ports:
      - "${LLM_PORT}:${LLM_PORT}"
    command:
      - "-hf"
      - "${MODEL_HF_REPO}:${MODEL_HF_QUANT}"
      - "--alias"
      - "${MODEL_ALIAS}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${LLM_PORT}"
      - "--ctx-size"
      - "${LLM_CTX_SIZE}"
      - "--temp"
      - "${LLM_TEMP}"
      - "--top-p"
      - "${LLM_TOP_P}"
      - "--top-k"
      - "${LLM_TOP_K}"
      - "--min-p"
      - "${LLM_MIN_P}"
      - "--reasoning"
      - "off"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${LLM_PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      - llm
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: http://llm:${LLM_PORT}/v1
      MODEL_ALIAS: ${MODEL_ALIAS}
      LLM_PORT: ${LLM_PORT}
      HOME: /workspace/home
      XDG_CACHE_HOME: /workspace/home/.cache
      XDG_CONFIG_HOME: /workspace/home/.config
    volumes:
      - ./:/workspace/control:ro
      - ${TARGET_REPO}:/workspace/target
      - ./state/agent-home:/workspace/home
    working_dir: /workspace/target
    command:
      - bash
      - -lc
      - mkdir -p /workspace/home /workspace/home/.cache /workspace/home/.config && sleep infinity
    user: "${HOST_UID}:${HOST_GID}"
